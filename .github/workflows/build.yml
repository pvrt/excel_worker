name: Build Windows EXE and Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Create Google credentials from secrets (for embedded build)
        if: secrets.GOOGLE_CREDENTIALS_JSON != ''
        shell: pwsh
        run: |
          Write-Host "Creating credentials.json from secret..."
          $json = $env:GOOGLE_CREDENTIALS_JSON
          # Поддержка base64 (если секрет закодирован) и raw JSON
          try {
            $decoded = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($json.Trim()))
            if ($decoded.Trim().StartsWith("{")) { $json = $decoded; Write-Host "Decoded base64 credentials" }
          } catch {}
          $json | Out-File -Encoding utf8 "credentials.json"
          if ($env:GOOGLE_TOKEN_JSON -ne "") {
            $tjson = $env:GOOGLE_TOKEN_JSON
            try {
              $tdecoded = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($tjson.Trim()))
              if ($tdecoded.Trim().StartsWith("{")) { $tjson = $tdecoded }
            } catch {}
            $tjson | Out-File -Encoding utf8 "token.json"
            Write-Host "token.json created"
          }
          Write-Host "credentials.json ready, size $((Get-Item credentials.json).Length) bytes"
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          if (Test-Path "credentials.json") { Write-Host "Embedding credentials.json" -ForegroundColor Green; Get-Content credentials.json | Select-Object -First 2 }
          pyinstaller --onefile --noconsole --name "ExcelWorker" app.py
          dir dist
          if (!(Test-Path "dist/ExcelWorker.exe")) { throw "ExcelWorker.exe not found" }

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: ExcelWorker-windows
          path: dist/ExcelWorker.exe
          if-no-files-found: error
          retention-days: 14

      # Релиз только при пуше тега v* (например v1.0.0)
      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ExcelWorker.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Опционально: авто-релиз на каждый пуш в main (создаёт тег v0.0.<run_number>)
  # Раскомментируйте если хотите релиз на каждый коммит в main без ручных тегов
  auto-release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ExcelWorker-windows
          path: dist
      - name: Create auto tag release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.${{ github.run_number }}
          name: "Auto build ${{ github.run_number }}"
          files: dist/ExcelWorker.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
