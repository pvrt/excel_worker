name: Build Windows EXE and Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Embed Google Service Account (from secret)
        shell: pwsh
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_SERVICE_ACCOUNT_JSON)) { "WARNING: GOOGLE_SERVICE_ACCOUNT_JSON secret is empty - Google engine will need manual keys" }
          python tools/gen_embedded_sa.py
          if (Test-Path "google_sa_embedded.py") { Get-Item google_sa_embedded.py | Select-Object Name, Length }

      - name: Embed Google OAuth token (from secret)
        shell: pwsh
        env:
          GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_TOKEN)) { "WARNING: GOOGLE_OAUTH_TOKEN secret is empty - Google engine will need embedded SA or manual keys" }
          python tools/gen_embedded_oauth.py
          if (Test-Path "google_oauth_embedded.py") { Get-Item google_oauth_embedded.py | Select-Object Name, Length }

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name "ExcelWorker" --hidden-import google_sa_embedded --hidden-import google_oauth_embedded app.py
          dir dist
          if (!(Test-Path "dist/ExcelWorker.exe")) { throw "ExcelWorker.exe not found" }

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: ExcelWorker-windows
          path: dist/ExcelWorker.exe
          if-no-files-found: error
          retention-days: 14

      # Релиз только при пуше тега v* (например v1.0.0)
      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ExcelWorker.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Опционально: авто-релиз на каждый пуш в main (создаёт тег v0.0.<run_number>)
  # Раскомментируйте если хотите релиз на каждый коммит в main без ручных тегов
  auto-release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ExcelWorker-windows
          path: dist
      - name: Create auto tag release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.${{ github.run_number }}
          name: "Auto build ${{ github.run_number }}"
          files: dist/ExcelWorker.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
